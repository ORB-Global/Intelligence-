<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Orb Intelligence — Mission Control [BUILD-MARKER-8271]</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#161B26; --ink-soft:#4B5468; --porcelain:#F7F5F2; --surface:#FFFFFF; --line:#E7E2D9;
    --brass:#AD8A4E; --brass-soft:#F1E6D2;
    --win:#2E6F5E; --win-soft:#E4F0EC;
    --concern:#9C3D34; --concern-soft:#F6E7E4;
    --watch:#B98A2E; --watch-soft:#FBF0DC;
    --muted:#8B93A3; --muted-soft:#EEF0F3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--porcelain); color:var(--ink); font-family:'Public Sans',sans-serif; }
  a{ color:inherit; text-decoration:none; cursor:pointer; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:1.1rem 2.5rem; border-bottom:1px solid var(--line); background:var(--surface); }
  .brand{ font-family:'Fraunces',serif; font-weight:600; font-size:1.2rem; }
  .brand .tag{ font-family:'IBM Plex Mono',monospace; font-size:0.68rem; color:var(--ink-soft); margin-left:0.6rem; text-transform:uppercase; letter-spacing:0.08em; }
  .topbar-right{ display:flex; align-items:center; gap:1rem; font-size:0.85rem; color:var(--ink-soft); }
  .logout-btn{ background:none; border:1px solid var(--line); border-radius:8px; padding:0.4rem 0.9rem; cursor:pointer; font-size:0.82rem; color:var(--ink); font-family:inherit; }

  .breadcrumbs{ padding:1.5rem 2.5rem 0; font-size:0.85rem; color:var(--ink-soft); }
  .breadcrumbs a:hover{ color:var(--brass); }

  .page{ max-width:1520px; margin:0 auto; padding:1.5rem 2.8rem 5rem; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:1.9rem; margin:0 0 0.3rem; }
  .subtitle{ color:var(--ink-soft); font-size:0.9rem; margin-bottom:2rem; }

  .card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:1rem; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:1.4rem; }
  .card:hover{ border-color:var(--brass); }
  .card h3{ font-family:'Fraunces',serif; font-weight:500; font-size:1.1rem; margin:0 0 0.5rem; }

  .badge{ display:inline-block; font-size:0.7rem; font-weight:600; padding:0.2rem 0.6rem; border-radius:999px; text-transform:uppercase; letter-spacing:0.03em; }
  .badge.active, .badge.connected, .badge.current, .badge.verified{ background:var(--win-soft); color:var(--win); }
  .badge.inactive, .badge.missing, .badge.stale, .badge.sync_error, .badge.conflict{ background:var(--concern-soft); color:var(--concern); }
  .badge.needs_verification, .badge.delayed, .badge.expired, .badge.permission_issue, .badge.partial{ background:var(--watch-soft); color:var(--watch); }
  .badge.unmapped, .badge.never_synced, .badge.unavailable{ background:var(--muted-soft); color:var(--muted); }

  .section{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:1.5rem; margin-bottom:1.2rem; }
  .section h2{ font-family:'IBM Plex Mono',monospace; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); margin:0 0 1rem; }

  table{ width:100%; border-collapse:collapse; font-size:0.88rem; }
  th{ text-align:left; font-family:'IBM Plex Mono',monospace; font-size:0.7rem; text-transform:uppercase; color:var(--ink-soft); padding:0.5rem 0.6rem; border-bottom:1px solid var(--line); }
  td{ padding:0.6rem; border-bottom:1px solid var(--line); }

  .warning-strip{ display:flex; gap:0.6rem; align-items:flex-start; background:var(--watch-soft); border:1px solid #EBDBAE; border-radius:10px; padding:0.9rem 1.1rem; font-size:0.85rem; color:#6B5623; margin-bottom:1.2rem; }
  .pending-box{ background:var(--watch-soft); border:1px solid #EBDBAE; border-radius:10px; padding:1.1rem; margin-top:1rem; }
  .pending-box .row{ display:flex; gap:0.6rem; margin-top:0.9rem; }
  button.primary{ font-family:inherit; font-weight:600; font-size:0.82rem; padding:0.5rem 1rem; border-radius:8px; border:none; background:var(--ink); color:var(--porcelain); cursor:pointer; }
  button.secondary{ font-family:inherit; font-weight:600; font-size:0.82rem; padding:0.5rem 1rem; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }

  .state{ text-align:center; padding:4rem 2rem; color:var(--ink-soft); }
  .state h2{ font-family:'Fraunces',serif; font-weight:500; color:var(--ink); font-size:1.3rem; margin-bottom:0.5rem; }
  .pulse{ animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.5;} }

  .hidden{ display:none !important; }
  @media (max-width:640px){ .page{ padding:1rem; } .topbar{ padding:1rem; flex-wrap:wrap; gap:0.6rem; } }

  /* Client Mission Control - intelligence-first hierarchy */
  .hero{ background:linear-gradient(135deg, var(--ink) 0%, #232a3a 100%); color:var(--porcelain); border-radius:16px; padding:2rem 2.2rem; margin-bottom:1.5rem; }
  .hero .hero-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.1em; color:#B9C0CE; margin-bottom:0.3rem; }
  .hero h1{ color:var(--porcelain); margin-bottom:0.2rem; }
  .hero .hero-sub{ color:#B9C0CE; font-size:0.85rem; margin-bottom:1.5rem; }
  .hero-stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:1.2rem; }
  .hero-stat .num{ font-family:'Fraunces',serif; font-size:2.1rem; font-weight:600; line-height:1; }
  .hero-stat .stat-label{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:#B9C0CE; margin-top:0.35rem; }
  .hero-stat.strong .num{ color:#7FD9B9; } .hero-stat.watch .num{ color:#F0C674; } .hero-stat.weak .num{ color:#F0968A; }

  .intel-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  @media (max-width:800px){ .intel-grid{ grid-template-columns:1fr; } }
  .intel-item{ display:flex; gap:0.7rem; padding:0.7rem 0; border-bottom:1px solid var(--line); }
  .intel-item:last-child{ border-bottom:none; }
  .intel-dot{ width:8px; height:8px; border-radius:50%; margin-top:0.4rem; flex-shrink:0; }
  .intel-dot.positive{ background:var(--win); } .intel-dot.watch{ background:var(--watch); } .intel-dot.negative{ background:var(--concern); }

  .timeline{ display:flex; flex-direction:column; }
  .timeline-item{ display:flex; gap:1rem; padding-bottom:1.4rem; position:relative; }
  .timeline-item::before{ content:''; position:absolute; left:5px; top:22px; bottom:0; width:1px; background:var(--line); }
  .timeline-item:last-child::before{ display:none; }
  .timeline-dot{ width:11px; height:11px; border-radius:50%; margin-top:5px; flex-shrink:0; z-index:1; }
  .timeline-dot.signal{ background:var(--muted); } .timeline-dot.recommendation{ background:var(--brass); }
  .timeline-dot.action{ background:var(--watch); } .timeline-dot.outcome{ background:var(--win); }
  .timeline-label{ font-family:'IBM Plex Mono',monospace; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:0.2rem; }
  .timeline-desc{ font-size:0.9rem; }
  .timeline-date{ font-size:0.75rem; color:var(--muted); margin-top:0.2rem; }

  .not-available{ padding:2rem; text-align:center; color:var(--muted); font-size:0.85rem; border:1px dashed var(--line); border-radius:10px; }

  /* Explore with Orb Intelligence */
  .explore-btn{ position:fixed; bottom:1.5rem; right:1.5rem; background:var(--ink); color:var(--porcelain); border:none; border-radius:999px; padding:0.85rem 1.4rem; font-family:inherit; font-weight:600; font-size:0.88rem; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,0.25); z-index:50; }
  .explore-drawer{ position:fixed; top:0; right:0; bottom:0; width:min(420px, 100vw); background:var(--surface); box-shadow:-8px 0 30px rgba(0,0,0,0.2); z-index:100; display:flex; flex-direction:column; transform:translateX(100%); transition:transform 0.25s ease; }
  .explore-drawer.open{ transform:translateX(0); }
  .explore-header{ padding:1.2rem; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .explore-header h3{ font-family:'Fraunces',serif; font-size:1.1rem; margin:0; }
  .explore-usage{ font-size:0.75rem; color:var(--ink-soft); padding:0.5rem 1.2rem; border-bottom:1px solid var(--line); }
  .explore-messages{ flex:1; overflow-y:auto; padding:1.2rem; display:flex; flex-direction:column; gap:1rem; }
  .explore-msg{ font-size:0.87rem; line-height:1.5; }
  .explore-msg.user{ align-self:flex-end; background:var(--ink); color:var(--porcelain); padding:0.6rem 0.9rem; border-radius:10px 10px 2px 10px; max-width:85%; }
  .explore-msg.assistant{ align-self:flex-start; padding:0.6rem 0; max-width:95%; }
  .explore-suggested{ display:flex; flex-wrap:wrap; gap:0.4rem; padding:0 1.2rem 1rem; }
  .explore-suggested button{ font-family:inherit; font-size:0.76rem; padding:0.35rem 0.7rem; border-radius:999px; border:1px solid var(--line); background:transparent; cursor:pointer; color:var(--ink-soft); }
  .explore-input-row{ display:flex; gap:0.5rem; padding:1rem; border-top:1px solid var(--line); }
  .explore-input-row input{ flex:1; padding:0.6rem 0.8rem; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:0.87rem; }
  .explore-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.2); z-index:99; opacity:0; pointer-events:none; transition:opacity 0.25s ease; }
  .explore-backdrop.open{ opacity:1; pointer-events:auto; }
  .explore-remaining-badge{ display:inline-block; background:var(--brass-soft); color:#6B5623; font-size:0.75rem; font-weight:600; padding:0.3rem 0.7rem; border-radius:999px; }

  /* ---------- Brain Center: real multi-column command-center layout ---------- */
  .brain-hero{ background:linear-gradient(160deg, #12151f 0%, #232a3a 55%, #1a2130 100%); color:var(--porcelain); border-radius:20px; padding:2.6rem 2.8rem; margin-bottom:1.4rem; position:relative; overflow:hidden; max-width:1180px; margin-left:auto; margin-right:auto; }
  .orb-thread{ display:flex; flex-direction:column; gap:0.5rem; max-width:600px; }
  .orb-greeting{ font-family:'Fraunces',serif; font-weight:500; font-size:1.7rem; color:#F7F8FA; margin-bottom:0.9rem; line-height:1.25; }
  .orb-msg.minor{ background:transparent; border:none; padding:0.3rem 0.2rem; }
  .orb-msg.minor .orb-msg-text{ font-size:0.84rem; color:#AEB4C2; }
  .orb-msg.dominant{ padding:1.3rem 1.5rem; border-radius:16px; }
  .orb-msg.dominant .orb-msg-text{ font-size:1.08rem; font-weight:500; }
  .orb-msg{ background:rgba(255,255,255,0.055); border-radius:16px 16px 16px 4px; padding:0.85rem 1.1rem; max-width:92%; animation: msgIn 0.35s ease-out backwards; }
  .orb-msg.tier-needs_attention{ background:rgba(224,121,111,0.14); border:1px solid rgba(224,121,111,0.3); }
  .orb-msg.tier-opportunity{ background:rgba(173,138,78,0.14); border:1px solid rgba(173,138,78,0.32); }
  .orb-msg.tier-watching{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); }
  .orb-msg.tier-healthy{ background:rgba(79,191,154,0.1); border:1px solid rgba(79,191,154,0.25); }
  .orb-msg-label{ font-size:0.64rem; text-transform:uppercase; letter-spacing:0.08em; color:#8F98AC; margin-bottom:0.3rem; }
  .orb-msg-text{ font-size:0.92rem; line-height:1.55; color:#EBEDF2; }
  @keyframes msgIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .reply-box{ display:flex; gap:0.5rem; margin-top:1rem; max-width:600px; }
  .reply-box input{ flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18); border-radius:999px; padding:0.7rem 1.1rem; color:#E4E8EE; font-family:inherit; font-size:0.88rem; }
  .reply-box button{ background:var(--brass); color:#1A1E28; border:none; border-radius:999px; padding:0.7rem 1.3rem; font-weight:600; cursor:pointer; font-size:0.85rem; }
  .quick-replies{ display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.7rem; max-width:600px; }
  .brain-hero-top{ display:flex; gap:2.5rem; align-items:flex-start; flex-wrap:wrap; }
  .brain-hero-text{ flex:1; min-width:300px; }
  .brain-greeting{ font-family:'Fraunces',serif; font-size:1.7rem; font-weight:500; margin-bottom:0.3rem; }
  .brain-subline{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.1em; color:#8F98AC; margin-bottom:1rem; }
  .brain-briefing{ font-size:1.02rem; line-height:1.55; color:#E4E8EE; max-width:600px; margin-bottom:1.4rem; }
  .brain-findings{ display:flex; flex-direction:column; gap:0.55rem; margin-bottom:1.5rem; }
  .brain-finding{ display:flex; gap:0.6rem; align-items:flex-start; font-size:0.87rem; color:#D6DAE3; }
  .brain-finding .dot{ width:6px; height:6px; border-radius:50%; margin-top:0.5rem; flex-shrink:0; background:var(--brass); }
  .brain-ask-cta{ background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:12px; padding:0.9rem 1.2rem; display:flex; justify-content:space-between; align-items:center; cursor:pointer; max-width:520px; }
  .command-option{ font-family:inherit; font-size:0.82rem; padding:0.5rem 0.9rem; border-radius:999px; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.05); color:#E4E8EE; cursor:pointer; }
  .next-action{ border-radius:14px; padding:1.2rem 1.4rem; margin:1rem 0 1.2rem; max-width:600px; }
  .next-action.tier-needs_attention{ background:rgba(224,121,111,0.12); border:1px solid rgba(224,121,111,0.35); }
  .next-action.tier-opportunity{ background:rgba(173,138,78,0.12); border:1px solid rgba(173,138,78,0.4); }
  .next-action.tier-watching{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); }
  .next-action.tier-healthy{ background:rgba(79,191,154,0.1); border:1px solid rgba(79,191,154,0.3); }
  .next-action-label{ font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.4rem; opacity:0.85; }
  .command-option:hover{ background:rgba(255,255,255,0.12); }
  .brain-ask-cta:hover{ background:rgba(255,255,255,0.13); }
  .brain-ask-cta span.label{ font-weight:600; font-size:0.88rem; }
  .brain-ask-cta span.sub{ font-size:0.76rem; color:#9CA4B5; display:block; margin-top:0.15rem; }
  .brain-viz-wrap{ width:340px; height:300px; flex-shrink:0; position:sticky; top:24px; }
  .brain-viz-glow{ position:absolute; inset:-30px; background:radial-gradient(circle, rgba(173,138,78,0.16) 0%, rgba(173,138,78,0.04) 45%, transparent 70%); border-radius:50%; animation: glowbreathe 4.5s ease-in-out infinite; }
  @keyframes glowbreathe{ 0%,100%{ opacity:0.6; transform:scale(0.96); } 50%{ opacity:1; transform:scale(1.04); } }
  @media (max-width:900px){ .brain-viz-wrap{ width:240px; height:210px; position:static; } .brain-hero-top{ flex-direction:column; } }


  @keyframes nodepulse{ 0%,100%{ opacity:0.35; r:3.2; } 50%{ opacity:1; r:4.4; } }
  @keyframes edgeflow{ 0%{ stroke-dashoffset:24; } 100%{ stroke-dashoffset:0; } }
  .brain-node{ animation: nodepulse 3.4s ease-in-out infinite; }
  .brain-node.inactive{ animation: none; opacity:0.15; }
  .brain-edge{ stroke-dasharray:4 4; animation: edgeflow 6s linear infinite; opacity:0.4; }
  @media (prefers-reduced-motion: reduce){ .brain-node{ animation:none; opacity:0.75; } .brain-edge{ animation:none; } }

  .pulse-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:0.9rem; margin-bottom:1.4rem; }
  .pulse-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:1.1rem 1.2rem; }
  .pulse-card .pulse-label{ font-family:'IBM Plex Mono',monospace; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:0.4rem; }
  .pulse-card .pulse-value{ font-family:'Fraunces',serif; font-size:1.6rem; font-weight:600; }
  .pulse-card .pulse-trend{ font-size:0.76rem; margin-top:0.2rem; }
  .pulse-trend.up{ color:var(--win); } .pulse-trend.down{ color:var(--concern); } .pulse-trend.flat{ color:var(--ink-soft); }

  .brain-columns{ display:grid; grid-template-columns:repeat(3, 1fr); gap:1.1rem; align-items:start; }
  @media (max-width:1000px){ .brain-columns{ grid-template-columns:1fr 1fr; } }
  @media (max-width:680px){ .brain-columns{ grid-template-columns:1fr; } }
  .brain-col{ display:flex; flex-direction:column; gap:1.1rem; }
  .brain-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:1.3rem 1.4rem; }
  .brain-card h3{ font-family:'IBM Plex Mono',monospace; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:0 0 0.8rem; }
  .brain-card .empty-honest{ font-size:0.82rem; color:var(--muted); }
  .activity-item{ display:flex; gap:0.6rem; padding:0.5rem 0; border-bottom:1px solid var(--line); font-size:0.85rem; }
  .activity-item:last-child{ border-bottom:none; }
  .activity-badge{ font-size:0.64rem; text-transform:uppercase; font-weight:600; padding:0.15rem 0.5rem; border-radius:999px; background:var(--brass-soft); color:#6B5623; flex-shrink:0; height:fit-content; }

  /* Real visual redesign - hero dominant, executive intelligence
     prominent, charts instead of tables, compact status chips */
  .hero{ padding:2.4rem 2.4rem 2.2rem; }
  .hero .hero-eyebrow{ font-size:0.75rem; }
  .hero h1{ font-size:2.3rem; }
  .hero-stats{ margin-top:1.8rem; gap:1.6rem; }
  .hero-stat .num{ font-size:2.5rem; }
  .confidence-pill{ display:inline-flex; align-items:center; gap:0.3rem; font-size:0.72rem; color:#B9C0CE; margin-top:0.5rem; }
  .confidence-pill .dot{ width:6px; height:6px; border-radius:50%; }
  .confidence-pill .dot.high{ background:#7FD9B9; } .confidence-pill .dot.medium{ background:#F0C674; } .confidence-pill .dot.low{ background:#F0968A; }

  .executive-section{ background:linear-gradient(180deg, var(--brass-soft) 0%, var(--surface) 45%); border:1px solid #E8D9BC; border-radius:16px; padding:1.8rem 2rem; margin-bottom:1.2rem; }
  .executive-section h2{ color:#6B5623; font-size:0.8rem; }

  .compact-row{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:0.8rem 1.1rem; margin-bottom:0.6rem; }
  .data-health-badge{ display:inline-flex; align-items:center; gap:0.4rem; font-size:0.78rem; color:var(--ink-soft); cursor:pointer; padding:0.3rem 0.7rem; border-radius:999px; border:1px solid var(--line); }
  .data-health-badge .dot{ width:6px; height:6px; border-radius:50%; background:var(--win); }
  .data-health-detail{ margin-top:0.6rem; }
  .compact-row .compact-label{ font-size:0.85rem; font-weight:500; }
  .compact-row .compact-detail{ font-size:0.78rem; color:var(--ink-soft); }

  .capability-chip{ display:inline-flex; align-items:center; gap:0.5rem; background:var(--muted-soft); border-radius:999px; padding:0.4rem 0.9rem; font-size:0.8rem; color:var(--ink-soft); margin-right:0.5rem; margin-bottom:0.5rem; }
  .capability-chip .chip-dot{ width:6px; height:6px; border-radius:50%; background:var(--muted); }

  .chart-wrap{ position:relative; height:180px; margin-bottom:0.8rem; }
  .channel-tabs{ display:flex; gap:0.4rem; margin-bottom:1rem; }
  .channel-tabs button{ font-family:inherit; font-size:0.8rem; padding:0.4rem 0.9rem; border-radius:999px; border:1px solid var(--line); background:transparent; cursor:pointer; color:var(--ink-soft); }
  .channel-tabs button.active{ background:var(--ink); color:var(--porcelain); border-color:var(--ink); }
  .detail-toggle{ font-size:0.8rem; color:var(--brass); cursor:pointer; text-decoration:underline; margin-top:0.5rem; display:inline-block; }

  .story-flow{ display:flex; flex-direction:column; gap:0; }
  .story-chain{ border:1px solid var(--line); border-radius:12px; padding:1.2rem; margin-bottom:0.8rem; }
  .story-step{ display:flex; align-items:flex-start; gap:0.7rem; padding:0.4rem 0; }

  async function apiFetch(path, options = {}, timeoutMs = 15000){
    const { data } = await client.auth.getSession();
    if (!data.session) { window.location.href = '/login.html'; throw new Error('No session'); }
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    let res;
    try {
      res = await fetch(path, {
        ...options,
        signal: controller.signal,
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${data.session.access_token}`, ...(options.headers||{}) },
      });
    } catch (err) {
      if (err.name === 'AbortError') throw new Error(`Request timed out after ${timeoutMs/1000}s: ${path}`);
      throw err;
    } finally {
      clearTimeout(timeoutId);
    }
    if (res.status === 401) { window.location.href = '/login.html'; throw new Error('Session expired'); }
    const body = await res.json();
    if (!res.ok || !body.success) { throw Object.assign(new Error(body.error?.message || `HTTP ${res.status}`), { status: res.status }); }
    return body.data;
  }

  const CHANNEL_LABELS = {

  // Humanizes structured evidence into plain-language lines - the
  // client must never see raw evidence JSON. Handles the known real
  // evidence shapes; falls back to omitting anything it doesn't
  // recognize rather than dumping raw keys.
  function humanizeEvidence(evidence){
    if (!evidence || typeof evidence !== 'object') return [];
    const lines = [];
    const pct = (v) => (v > 0 ? '+' : '') + Math.round(v) + '%';
    if (evidence.social_engagement_pct_change !== undefined) lines.push(`Facebook engagement ${pct(evidence.social_engagement_pct_change)}`);
    if (evidence.local_visibility_pct_change !== undefined) lines.push(`Local visibility ${pct(evidence.local_visibility_pct_change)}`);
    if (evidence.paid_clicks_pct_change !== undefined) lines.push(`Paid advertising clicks ${pct(evidence.paid_clicks_pct_change)}`);
    if (evidence.pct_change !== undefined && evidence.metric) {
      const label = String(evidence.metric).replace(/_/g,' ').replace('social engagement','Facebook engagement').replace('local calls','Local search calls');
      lines.push(`${label.charAt(0).toUpperCase()+label.slice(1)} ${pct(evidence.pct_change)}`);
    }
    return lines;
  }

  let currentLocationId = null;
  let currentConversationId = null;

  let activeChart = null;

  async function viewLocation(locId){
    showOnly('loadingState');
    currentLocationId = locId;
    document.getElementById('exploreBtn').classList.remove('hidden');
    try {
      const { location, connections, metrics, feed, health, socialMetrics, localMetrics, briefing, marketProfile, competitors, openQuestions, brainState, recentActivity, memory, investigations, performance, activitySummary, competitivePulse: competitivePulseData, thesis, nextAction, nextMove, portfolioContext, goal, businessState } = await apiFetch(`/api/mc/locations/${locId}`);

      // Real seen-tracking: a first view of an investigation gets the
      // full detail; a return visit gets a quiet recap instead of a
      // replay. Fetched here, used when building the dominant message
      // below.
      let investigationSeenInfo = null;
      if (nextMove?.moveType === 'INVESTIGATE' && nextMove.sourceId) {
        try { investigationSeenInfo = await apiFetch(`/api/mc/investigations/${nextMove.sourceId}/seen`, { method: 'POST' }); } catch (e) { /* non-fatal */ }
      }
      // One real in-context activity line - not a separate feed
      // section, just the most relevant thing Vantage or Orb Global
      // actually did recently, shown where it's relevant.
      let inContextActivity = null;
      try {
        const activityData = await apiFetch(`/api/mc/locations/${locId}/unified-activity`);
        inContextActivity = (activityData || []).find(a => a.actor === 'orb_global_staff') || (activityData || [])[0] || null;
      } catch (e) { /* non-fatal */ }
      setBreadcrumbs([
        { label: 'Mission Control', action: 'viewOrganizations()' },
        { label: location.organizations?.name || 'Organization', action: `viewOrganization('${location.organization_id}')` },

      const content = document.getElementById('content');

      const score = brainState?.overall_score ?? null;

      const workingItems = [...positiveFactors.map(f => f.explanation || f.factor), ...crossSourceSignals.map(s => s.description)];

      // Top 3-5 findings for the hero, prioritized: signals first, then recommendations
      const topFindings = [...signalsRecent, ...recommendations].slice(0, 4);
      const activeInvestigations = (investigations || []).filter(i => i.status === 'investigating' || i.status === 'open');
      const hasActiveInvestigation = activeInvestigations.length > 0;

      // ---------- Brain nodes represent ACTIVE REASONING, not

      // current signal or investigation actually involves that

      // Domains with nothing to show simply stay quiet - no "not

      const evidenceHasKey = (substr) => signalsRecent.some(s => s.evidence && Object.keys(s.evidence).some(k => k.toLowerCase().includes(substr)));
      const recentActivityWindow = recentActivity && recentActivity.some(a => (Date.now() - new Date(a.occurred_at).getTime()) < 14*86400000);
      const memoryQualifies = memory && memory.some(m => m.confidence !== 'emerging');
      const domains = [
        { key: 'customer_attention', label: 'Customer Attention', active: crossSourceSignals.length > 0 },
        { key: 'advertising', label: 'Advertising', active: evidenceHasKey('paid') || evidenceHasKey('clicks') },

      ];
      const nodePositions = [[90,10],[142,32],[170,90],[142,148],[90,170],[38,148],[10,90],[38,32],[90,90]];
      // Real hand-drawn pencil brain, replacing the abstract dot/line

      const anyAttentionActive = domains.some(d => d.active);

            <path fill="none" stroke="rgba(232,196,129,0.35)" stroke-width="0.7" stroke-linecap="round" d="M 299 212 C 309 216, 320 216, 329 212"/>
            <path fill="none" stroke="rgba(232,196,129,0.6)" stroke-width="1.4" stroke-linecap="round" d="M 305 224 C 306 234, 304 242, 300 248"/>
            ${['M 130 62 C 138 76, 133 88, 142 100','M 175 47 C 181 62, 176 76, 184 88','M 225 40 C 232 54, 227 67, 235 80','M 275 47 C 281 60, 276 72, 284 84','M 320 70 C 325 82, 320 92, 327 102'].map((d,i) => {
              const active = domains[i]?.active;
              return `<path fill="none" stroke="rgba(232,196,129,${active?0.75:0.28})" stroke-width="0.9" stroke-linecap="round" d="${d}" ${active ? `style="animation: gyriPulse ${2.6+i*0.5}s ease-in-out infinite;"` : ''}/>`;
            }).join('')}
          </g>
        </svg>
      </div>
      <style>
        @keyframes pencilBreathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.015); } }
        @keyframes gyriPulse{ 0%,100%{ opacity:0.35; } 50%{ opacity:0.85; } }
      </style>`;
      const activeDomainLabels = domains.filter(d => d.active).map(d => d.label);

      // ---------- Layer 1: Brain landing - minimal, ~10-second read ----------
      // Real backend-computed pulse (checks actual competitor_change
      // signals, honestly reports discovery-only vs enriched) replaces
      // the old client-side approximation.
      const competitivePulse = competitivePulseData?.pulseText || 'Competitive monitoring not yet established for this account.';
      const marketPulse = marketProfile
        ? `Orb is tracking market conditions for ${escapeHtml(marketProfile.primary_market || 'your area')}.`
        : 'Market profile not yet resolved for this account.';

      const mostImportant = topFindings[0]?.description || 'Nothing significant to report yet - Orb is still building history on this account.';
      const opportunityOrRisk = recommendations[0]?.description || crossSourceSignals[0]?.description || 'No specific opportunity or risk identified yet this period.';
      const watching = activeInvestigations.length
        ? `Orb is continuing to evaluate ${activeInvestigations.length} developing pattern${activeInvestigations.length===1?'':'s'} on this account.`
        : (openQuestions && openQuestions.length
          ? `Orb is currently working to resolve ${openQuestions.length} open question${openQuestions.length===1?'':'s'} about this account.`
          : 'Nothing currently under active investigation.');

      // ---------- Business Thesis: restructured per spec -
      // Momentum -> why -> 4 labeled sections, point-of-view language
      // instead of "still working out why" ----------
      const drivingView = crossSourceSignals.length
        ? crossSourceSignals[0].description
        : (signalsRecent[0]?.description || 'No significant single development is driving the current view.');
      const mattersMost = opportunityOrRisk;
      const mattersMostRecId = recommendations[0]?.id || null;
      const watchingNext = activeInvestigations.length
        ? `Orb believes this deserves attention because the movement appeared in more than one place at once. Orb is now checking whether the pattern continues and what may have contributed to it.`
        : watching;
      const doneText = activitySummary?.headline || 'No recorded activity yet this period.';

      // Business Memory only appears when genuinely evidence-supported
      // - a single freshly-created 'emerging' row is not enough to
      // manufacture a client-facing pattern.
      const qualifyingMemory = (memory || []).filter(m => m.confidence !== 'emerging');

      // Real message-thread presentation: same real data as before,
      // presented as a sequence of things Orb has already said,
      // ending in a live reply box - not a static hero + card grid.
      // Real visual hierarchy restored: greeting stands alone and
      // large, the one thing that matters most is visually dominant,
      // everything else is genuinely secondary/scannable-past, not
      // uniform bubbles competing for the same attention.
      const threadMessages = [];
      if (performance?.momentum || briefing) {
        threadMessages.push({ weight: 'normal', label: performance?.momentum || null, text: briefing || "I'm still gathering enough history to brief you - check back soon." });
      }
      // THE INTERFACE IS CONTROLLED BY THE BRAIN: the dominant message
      // is now determined by the real Decision Engine state
      // (nextMove), not a fixed tier block. Responsibility-aware
      // framing per moveType - an open investigation, a real
      // recommendation, an urgent watch, or genuine calm are each
      // presented differently, because they ARE different, not
      // variations of one template.
      const moveLabels = {
        INVESTIGATE: 'Vantage is investigating',
        RECOMMEND: 'Vantage recommends',
        WATCH: "Vantage is watching this",
        ASK: 'Vantage needs one thing from you',
        DO_NOTHING: nextMove?.detail ? 'Nothing needs your attention' : "Vantage is still learning",
      };
      if (nextMove) {
        // Return-visit recap: same investigation, already seen -
        // advance the story instead of replaying the full detail.
        const isReturnVisit = nextMove.moveType === 'INVESTIGATE' && investigationSeenInfo && investigationSeenInfo.isFirstView === false;
        threadMessages.push({
          weight: 'dominant',
          tier: nextMove.moveType === 'RECOMMEND' ? 'opportunity' : (nextMove.moveType === 'WATCH' ? 'watching' : (nextMove.moveType === 'DO_NOTHING' ? 'healthy' : 'needs_attention')),
          label: isReturnVisit ? 'Still watching this' : (moveLabels[nextMove.moveType] || 'Orb sees'),
          text: nextMove.headline,
          subtext: isReturnVisit ? 'Same investigation as before - no new evidence yet.' : nextMove.detail,
          askQuestionId: nextMove.moveType === 'ASK' ? nextMove.sourceId : null,
        });
      } else if (nextAction) {
        threadMessages.push({
          weight: 'dominant',
          tier: nextAction.tier,
          label: ({needs_attention:'Needs Attention', opportunity:'Opportunity', watching:'Watching', healthy:'Healthy - Nothing To Do'})[nextAction.tier],
          text: nextAction.action,
        });
      }
      // Real de-duplication: the top signal often IS the same thing
      // the next-action block already surfaced (screenshots showed
      // this rendering as near-identical back-to-back text). Only
      // show "what's driving this" when it says something new.
      const drivingViewIsRedundant = nextAction && drivingView && nextAction.action && nextAction.action.includes(drivingView.slice(0, 40));
      if (!drivingViewIsRedundant) {
        threadMessages.push({ weight: 'minor', label: "What's driving this", text: drivingView });
      }
      // Real gating, not just de-weighting: when nothing genuinely
      // needs attention, speculative "what's driving this / what
      // matters most" filler is suppressed entirely rather than
      // shown at lower volume - per "silence is better than filler."
      // Orb Activity and confirmed memory stay, since they're real
      // proof of ongoing work, not manufactured insight.
      const isCalm = nextMove?.moveType === 'DO_NOTHING';
      if (!isCalm) {
        threadMessages.push({ weight: 'normal', label: 'What I believe matters most', text: mattersMost, recId: mattersMostRecId, subtext: portfolioContext });
        threadMessages.push({ weight: 'minor', label: "What I'm watching next", text: watchingNext });
      }
      // Real ad-level intelligence - only shown when a real intent
      // signal actually exists (leads/messaging), never fabricated.
      const topAd = businessState?.state?.top_ad;
      if (topAd?.status === 'ok') {
        threadMessages.push({ weight: 'minor', label: 'Your strongest real ad', text: topAd.clientFacingText });
      }
      const metaPacing = businessState?.state?.meta_pacing;
      if (metaPacing?.status === 'ok') {
        threadMessages.push({ weight: 'minor', label: 'Meta budget pacing', text: metaPacing.clientFacingText });
      }
      // Real, actor-aware in-context activity, matching the exact
      // truthful phrasing distinction required: Orb Global staff
      // action vs Vantage's own detection vs owner-reported context -
      // never blurred together.
      if (inContextActivity) {
        const actorLabel = { orb_global_staff: 'Orb Global', vantage_detected: 'Vantage', vantage_investigated: 'Vantage', owner: 'You' }[inContextActivity.actor] || 'Vantage';
        threadMessages.push({ weight: 'minor', label: actorLabel, text: inContextActivity.text.replace(/^(Vantage (noticed|investigated): |You told Vantage: )/, '') });
      } else if (doneText) {
        threadMessages.push({ weight: 'minor', label: "What I've done", text: doneText });
      }
      if (qualifyingMemory.length) {
        qualifyingMemory.forEach(m => threadMessages.push({ weight: 'minor', label: 'Already on my radar', text: m.observation }));
      }
      // Secondary active investigations/signals beyond the one the
      // Decision Engine already surfaced as dominant - shown quietly,
      // not competing for the same attention.
      const secondaryInvestigations = (investigations || []).filter(inv => inv.status === 'investigating' && inv.id !== nextMove?.sourceId);
      secondaryInvestigations.forEach(inv => {
        threadMessages.push({ weight: 'minor', label: 'Also investigating', text: inv.question });
      });
      // Competitive/market evidence lives in Explore, not the primary
      // thread - it's evidence for "why", not part of the homepage.

      const brainHero = `<div class="brain-hero">
        <div class="brain-hero-top">
          ${brainSvg}

          // REAL FIX for a genuine live crash: evidence_collected has
          // two real, different shapes depending on which real
          // investigation-creation path produced it - a real array of
          // {source, summary} objects (older path), or a real object
          // keyed by concept (e.g. {conversion:{...}, acquisition:{...}})
          // from check_and_open_investigation(). The crash
          // ((inv.evidence_collected || []).map is not a function)
          // happened because only the array shape was handled.

          if (Array.isArray(rawEvidence)) {
            evidenceLines = rawEvidence.map(e => e && e.summary).filter(Boolean);

      const commandCenter = `<div class="brain-columns">

        <div class="timeline hidden" id="timelineFull">

              <div>
                <div class="timeline-label">${timelineTitle[item.item_type] || item.item_type}</div>

              </div>

          `).join('')}

        <span class="detail-toggle" onclick="document.getElementById('timelineFull').classList.toggle('hidden')">View full history (${feed.length - 6} more)</span>` : ''}`}

      content.innerHTML = `

          </div>
          <div class="brain-card" style="margin-bottom:1.2rem;">

  function renderChannelChart(channel, canvasId){
    const rows = (window.__metricsData || []).filter(m => m.channel === channel).slice().sort((a,b) => a.period_start.localeCompare(b.period_start));
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    if (activeChart) activeChart.destroy();
    activeChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: rows.map(m => m.period_start),
        datasets: [
          { label: 'Spend ($)', data: rows.map(m => m.ad_spend), borderColor: '#AD8A4E', backgroundColor: 'rgba(173,138,78,0.08)', tension: 0.3, fill: true, yAxisID: 'y' },
          { label: 'Clicks', data: rows.map(m => m.clicks), borderColor: '#2E6F5E', backgroundColor: 'transparent', tension: 0.3, yAxisID: 'y1' },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } },
        scales: {
          y: { position: 'left', ticks: { font: { size: 10 } } },
          y1: { position: 'right', grid: { drawOnChartArea: false }, ticks: { font: { size: 10 } } },
          x: { ticks: { font: { size: 10 } } },
        },
      },
    });
  }

  function switchChannelChart(channel, btn){
    document.querySelectorAll('#channelTabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderChannelChart(channel, 'perfChart');
  }

  // ---------- Two-layer navigation: Brain landing <-> Explore My Business ----------
  function showExploreLayer(){
    document.getElementById('exploreLayer').classList.remove('hidden');
    document.getElementById('exploreLayer').scrollIntoView({ behavior: 'smooth' });
    // Chart.js sizes against the container at creation time - since
    // the canvas was hidden (display:none) when first rendered, it
    // would have measured 0 width. Re-render now that it's visible.
    if (window.__metricsData && window.__metricsData.length && window.Chart) {
      const firstChannel = [...new Set(window.__metricsData.map(m => m.channel))][0];
      renderChannelChart(firstChannel, 'perfChart');
    }
    loadTrackRecord();
    loadVantageMemory();
  }

  async function loadVantageMemory(){
    const el = document.getElementById('vantageMemoryContent');
    if (!el || el.dataset.loaded) return;
    try {
      const [locData, activityData] = await Promise.all([
        apiFetch(`/api/mc/locations/${currentLocationId}`),
        apiFetch(`/api/mc/locations/${currentLocationId}/unified-activity`),
      ]);
      el.dataset.loaded = 'true';
      const memoryData = locData.memory || [];
      const openQs = (locData.openQuestions || []).filter(q => q.status === 'open');

      const learned = (memoryData || []).filter(m => m.confidence !== 'emerging');
      const learnedHtml = learned.length
        ? learned.map(m => `<div class="intel-item"><div class="intel-dot positive"></div><div style="font-size:0.85rem; color:var(--ink-soft);">${escapeHtml(m.observation)}</div></div>`).join('')
        : '<p class="empty-honest">Nothing confirmed yet - patterns need to repeat before Vantage treats them as known.</p>';

      const happenedHtml = (activityData || []).slice(0, 5).map(a => {
        const actorLabel = { orb_global_staff: 'Orb Global', vantage_detected: 'Vantage', vantage_investigated: 'Vantage', owner: 'You' }[a.actor] || 'Vantage';
        return `<div class="intel-item"><div class="intel-dot"></div><div style="font-size:0.85rem;"><strong>${actorLabel}</strong> <span style="color:var(--ink-soft);">${escapeHtml(a.text.replace(/^(Vantage (noticed|investigated): |You told Vantage: )/, ''))}</span><div style="color:var(--muted); font-size:0.74rem; margin-top:0.15rem;">${new Date(a.occurred_at).toLocaleDateString()}</div></div></div>`;
      }).join('') || '<p class="empty-honest">Nothing recorded yet.</p>';

      const stillLearningHtml = openQs.length
        ? openQs.map(q => `<div class="intel-item"><div class="intel-dot watch"></div><div style="font-size:0.85rem; color:var(--ink-soft);">${escapeHtml(q.question)}</div></div>`).join('')
        : '<p class="empty-honest">No open questions right now.</p>';

      el.innerHTML = `
        <h4 style="font-size:0.85rem; margin-bottom:0.6rem;">What Vantage has learned</h4>
        ${learnedHtml}
        <h4 style="font-size:0.85rem; margin:1.2rem 0 0.6rem;">What happened</h4>
        ${happenedHtml}
        <h4 style="font-size:0.85rem; margin:1.2rem 0 0.6rem;">What Vantage is still trying to understand</h4>
        ${stillLearningHtml}
      `;
    } catch (err) {
      el.innerHTML = `<p class="empty-honest">Could not load: ${escapeHtml(err.message)}</p>`;
    }
  }

  async function loadTrackRecord(){
    const el = document.getElementById('trackRecordContent');
    if (!el || el.dataset.loaded) return;
    try {
      const tr = await apiFetch(`/api/mc/locations/${currentLocationId}/track-record`);
      el.dataset.loaded = 'true';
      const since = tr.watchingSince ? new Date(tr.watchingSince).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : 'recently';
      const statLine = `Orb has been watching this account since ${since} - ${tr.totalInvestigations} investigation${tr.totalInvestigations===1?'':'s'} opened (${tr.resolvedInvestigations} resolved), ${tr.totalVerdicts} recommendation${tr.totalVerdicts===1?'':'s'} judged against real results, ${tr.confirmedPatterns} confirmed pattern${tr.confirmedPatterns===1?'':'s'} on file.`;

      const invHtml = (tr.investigations || []).map(i => `
        <div class="intel-item">
          <div class="intel-dot ${i.status==='resolved'?'positive':i.status==='inconclusive'?'':'watch'}"></div>
          <div style="font-size:0.85rem;">
            <strong>${escapeHtml(i.question)}</strong>
            <div style="color:var(--ink-soft); margin-top:0.2rem;">${i.conclusion ? escapeHtml(i.conclusion) : `Status: ${i.status === 'investigating' ? 'Still active' : escapeHtml(i.status)}`}</div>
            <div style="color:var(--muted); font-size:0.76rem; margin-top:0.15rem;">Opened ${new Date(i.created_at).toLocaleDateString()}</div>
          </div>
        </div>`).join('') || '<p class="empty-honest">No investigations opened yet.</p>';

      const verdictHtml = (tr.verdicts || []).map(v => `
        <div class="intel-item">
          <div class="intel-dot ${v.verdict==='validated'?'positive':v.verdict==='not_validated'?'':'watch'}"></div>
          <div style="font-size:0.85rem;">
            <strong>${escapeHtml(v.recommendations?.recommendation_text || 'Recommendation')}</strong>
            <div style="color:var(--ink-soft); margin-top:0.2rem;">${escapeHtml(v.reasoning)} <span style="color:var(--muted); font-size:0.76rem;">(${v.source === 'client' ? 'confirmed by you' : "Orb's own judgment"})</span></div>
          </div>
        </div>`).join('') || '<p class="empty-honest">No recommendations judged against results yet.</p>';

      el.innerHTML = `
        <p style="font-size:0.9rem; color:var(--ink-soft); margin-bottom:1rem;">${escapeHtml(statLine)}</p>
        <h4 style="font-size:0.85rem; margin-bottom:0.6rem;">Investigation History</h4>
        ${invHtml}
        <h4 style="font-size:0.85rem; margin:1.2rem 0 0.6rem;">Recommendation Track Record</h4>
        ${verdictHtml}
      `;
    } catch (err) {
      el.innerHTML = `<p class="empty-honest">Could not load track record: ${escapeHtml(err.message)}</p>`;
    }
  }

  function showBrainLayer(){
    document.getElementById('exploreLayer').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function toggleWhyPanel(){
    document.getElementById('whyPanel').classList.toggle('hidden');
  }

  // Real end-to-end Create flow from the primary command surface -
  // calls the actual POST /create endpoint, sourced from whatever the
  // top real recommendation is for this location. Not a mockup.
  async function submitRecFeedback(recId, helped, btnEl){
    const wrapper = btnEl.parentElement;
    try {
      await apiFetch(`/api/mc/recommendations/${recId}/feedback`, { method: 'POST', body: JSON.stringify({ helped }) });
      wrapper.innerHTML = `<span style="font-size:0.74rem; color:#8F98AC;">Thanks — noted.</span>`;
    } catch (err) {
      wrapper.innerHTML = `<span style="font-size:0.74rem; color:#8F98AC;">Could not save feedback.</span>`;
    }
  }

  async function submitAskAnswer(questionId, inputEl){
    const answer = inputEl.value.trim();
    if (!answer) return;
    const wrapper = inputEl.parentElement;
    wrapper.innerHTML = `<span style="font-size:0.82rem; color:#C9A96A;">Got it. That changes what I'm looking at…</span>`;
    try {
      await apiFetch(`/api/mc/open-questions/${questionId}/answer`, { method: 'POST', body: JSON.stringify({ answer }) });
      setTimeout(() => viewLocation(currentLocationId), 1400);
    } catch (err) {
      wrapper.innerHTML = `<span style="font-size:0.78rem; color:#8F98AC;">Could not save that: ${escapeHtml(err.message)}</span>`;
    }
  }

  function appendThreadMessage(text, label){
    const thread = document.querySelector('.orb-thread');
    if (!thread) return;
    const el = document.createElement('div');
    el.className = 'orb-msg';
    el.innerHTML = `${label ? `<div class="orb-msg-label">${escapeHtml(label)}</div>` : ''}<div class="orb-msg-text">${escapeHtml(text)}</div>`;
    thread.appendChild(el);
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function askSuggested(q){
    document.getElementById('orbReplyInput').value = q;
    sendOrbReply();
  }

  // Real dual action: whatever the owner types becomes real business
  // context (stored, wired into future investigations/Ask Orb) AND
  // gets a real conversational reply, appended right into the same
  // thread - not a separate form, not a separate chat drawer.
  function looksLikeQuestion(text){
    const t = text.trim().toLowerCase();
    if (t.endsWith('?')) return true;
    return /^(what|why|how|who|when|where|which|is|are|do|does|did|can|should|will)\b/.test(t);
  }

  async function sendOrbReply(){
    const input = document.getElementById('orbReplyInput');
    const text = input.value.trim();
    if (!text || !currentLocationId) return;
    input.value = '';
    appendThreadMessage(text, 'You');
    appendThreadMessage('…', 'Orb');

    const isQuestion = looksLikeQuestion(text);
    try {
      if (isQuestion) {
        const result = await apiFetch(`/api/mc/locations/${currentLocationId}/ask`, {
          method: 'POST', body: JSON.stringify({ question: text, conversationId: currentConversationId }),
        });
        currentConversationId = result.conversationId;
        const answerText = [result.answer.findings, result.answer.recommended_actions, result.answer.insufficient_data].filter(Boolean).join(' ');
        updateLastOrbMessage(answerText);
      } else {
        // Tell Vantage: not a question, so Orb classifies and stores
        // it as real business context rather than trying to answer it.
        const result = await apiFetch(`/api/mc/locations/${currentLocationId}/tell`, {
          method: 'POST', body: JSON.stringify({ text }),
        });
        updateLastOrbMessage(`Got it - noted as ${result.classification.classified_type.replace('_',' ')}. ${result.classification.ai_summary}`);
      }
    } catch (err) {
      updateLastOrbMessage(`Could not process that: ${err.message}`);
    }
  }

  function updateLastOrbMessage(text){
    const pendingMsgs = document.querySelectorAll('.orb-msg-label');
    const lastMsg = [...pendingMsgs].reverse().find(l => l.textContent === 'Orb');
    if (lastMsg) lastMsg.nextElementSibling.textContent = text;
  }

  async function sendStorePulse(trafficLevel){
    if (!currentLocationId) return;
    appendThreadMessage(`Traffic: ${trafficLevel}`, 'You');
    appendThreadMessage('…', 'Orb');
    try {
      await apiFetch(`/api/mc/locations/${currentLocationId}/checkin`, {
        method: 'POST', body: JSON.stringify({ trafficLevel }),
      });
      updateLastOrbMessage('Thanks - noted.');
    } catch (err) {
      updateLastOrbMessage(`Could not save that: ${err.message}`);
    }
  }

  async function sendWeeklyNumbers(){
    if (!currentLocationId) return;
    const transactionCount = document.getElementById('weeklyTransactions').value;
    const salesEstimate = document.getElementById('weeklySales').value;
    if (!transactionCount && !salesEstimate) return;
    appendThreadMessage(`This week: ${transactionCount ? transactionCount + ' people in' : ''}${transactionCount && salesEstimate ? ', ' : ''}${salesEstimate ? '$' + salesEstimate + ' in sales' : ''}`, 'You');
    appendThreadMessage('…', 'Orb');
    try {
      await apiFetch(`/api/mc/locations/${currentLocationId}/checkin`, {
        method: 'POST', body: JSON.stringify({
          transactionCount: transactionCount ? Number(transactionCount) : undefined,
          salesEstimate: salesEstimate ? Number(salesEstimate) : undefined,
        }),
      });
      updateLastOrbMessage('Got it - saved for this week.');
      document.getElementById('weeklyTransactions').value = '';
      document.getElementById('weeklySales').value = '';
    } catch (err) {
      updateLastOrbMessage(`Could not save that: ${err.message}`);
    }
  }

  // logOrbChange intentionally not built into this client-facing page
  // - it would let any authenticated client self-report a fake Orb
  // action. That needs a genuine staff-only entry point instead.

  async function showWhereYouStand(){
    const panel = document.getElementById('whereYouStandPanel');
    panel.classList.remove('hidden');
    panel.innerHTML = '<p>Checking where you stand…</p>';
    try {
      const [r, synthesis] = await Promise.all([
        apiFetch(`/api/mc/locations/${currentLocationId}/where-you-stand`),
        apiFetch(`/api/mc/locations/${currentLocationId}/position-synthesis`),
      ]);

      const compHtml = (r.competitors || []).map(c =>
        `<div style="display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid rgba(255,255,255,0.06);"><span>${escapeHtml(c.name)}</span><span style="color:#8F98AC;">${Number(c.rankedKeywords).toLocaleString()} ranked keywords</span></div>`
      ).join('') || '<p style="color:#8F98AC; font-size:0.85rem;">No competitors identified yet.</p>';

      const historyLine = r.monthsOfHistory > 0
        ? `<p style="font-size:0.85rem; color:#C9CFDA; margin-top:1rem;">Vantage has ${r.monthsOfHistory} months of real history on file (${r.historyAvailableFrom} to ${r.historyAvailableTo}). <span style="text-decoration:underline; cursor:pointer;" onclick="askSuggested('Show me what changed over the full history you have')">Want to see how far back it goes?</span></p>`
        : '';

      const sectionRow = (label, s) => `
        <div style="margin-bottom:0.9rem;">
          <div style="font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; color:#8F98AC;">${label}: <span style="color:#E8C481;">${escapeHtml(s.status)}</span></div>
          <div style="font-size:0.88rem; color:#EBEDF2; margin-top:0.2rem;">${escapeHtml(s.text)}</div>
        </div>`;

      panel.innerHTML = `
        <div style="font-weight:600; font-size:0.95rem; margin-bottom:0.9rem; color:#F0F2F5;">Where You Stand</div>
        ${sectionRow('Against yourself', synthesis.yourself)}
        ${sectionRow('Against your market', synthesis.market)}
        ${sectionRow('Against competitors', synthesis.competition)}
        <div style="font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; color:#8F98AC; margin:1rem 0 0.4rem;">Competitors nearby</div>
        ${compHtml}
        ${historyLine}
      `;
    } catch (err) {
      panel.innerHTML = `<p>Could not check: ${escapeHtml(err.message)}</p>`;
    }
  }

  async function editGoal(){
    if (!currentLocationId) return;
    const goalText = prompt("What are you working toward right now? (e.g. \"more weekend foot traffic\", \"sell more sectionals this month\")");
    if (!goalText || !goalText.trim()) return;
    try {
      await apiFetch(`/api/mc/locations/${currentLocationId}/goal`, {
        method: 'POST', body: JSON.stringify({ goalText: goalText.trim() }),
      });
      viewLocation(currentLocationId);
    } catch (err) {
      alert(`Could not save goal: ${err.message}`);
    }
  }


  async function showValueReceipt(){
    const panel = document.getElementById('valueReceiptPanel');
    panel.classList.remove('hidden');
    panel.innerHTML = '<p>Building your Orb Month…</p>';
    try {
      const r = await apiFetch(`/api/mc/locations/${currentLocationId}/value-receipt?days=30`);
      panel.innerHTML = `
        <div style="font-weight:600; font-size:0.95rem; margin-bottom:0.6rem; color:#F0F2F5;">Your Orb Month</div>
        <div style="font-size:0.85rem; color:#C9CFDA; margin-bottom:0.8rem;">Orb monitored your business for the last ${r.periodDays} days.</div>
        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:0.6rem; margin-bottom:0.9rem;">
          <div><div style="font-size:1.4rem; font-weight:600; color:#E8C481;">${r.opportunitiesInvestigated}</div><div style="font-size:0.72rem; color:#9CA4B5;">opportunities investigated</div></div>
          <div><div style="font-size:1.4rem; font-weight:600; color:#E8C481;">${r.recommendationsMade}</div><div style="font-size:0.72rem; color:#9CA4B5;">recommendations made</div></div>
          <div><div style="font-size:1.4rem; font-weight:600; color:#E8C481;">${r.actionsTaken}</div><div style="font-size:0.72rem; color:#9CA4B5;">actions taken</div></div>
          <div><div style="font-size:1.4rem; font-weight:600; color:#E8C481;">${r.creativesEvaluated}</div><div style="font-size:0.72rem; color:#9CA4B5;">creatives evaluated</div></div>
        </div>
        ${r.whatMattered ? `<div style="margin-bottom:0.6rem;"><div class="orb-msg-label">What mattered</div><div class="orb-msg-text">${escapeHtml(r.whatMattered)}</div></div>` : ''}
        ${r.whatChanged ? `<div style="margin-bottom:0.6rem;"><div class="orb-msg-label">What changed</div><div class="orb-msg-text">${escapeHtml(r.whatChanged)}</div></div>` : ''}
        ${r.whatOrbLearned ? `<div style="margin-bottom:0.6rem;"><div class="orb-msg-label">What Orb learned</div><div class="orb-msg-text">${escapeHtml(r.whatOrbLearned)}</div></div>` : ''}
        ${r.whatOrbIsWatchingNext ? `<div><div class="orb-msg-label">What Orb is watching next</div><div class="orb-msg-text">${escapeHtml(r.whatOrbIsWatchingNext)}</div></div>` : ''}
      `;
    } catch (err) {
      panel.innerHTML = `<p>Could not build your Orb Month: ${escapeHtml(err.message)}</p>`;
    }
  }

  async function startCreateFlow(){
    const panel = document.getElementById('createPanel');
    panel.classList.remove('hidden');
    panel.innerHTML = '<p>Generating a creative concept from your most relevant opportunity…</p>';
    try {
      const locationData = await apiFetch(`/api/mc/locations/${currentLocationId}`);
      const topRec = (locationData.feed || []).find(f => f.item_type === 'recommendation');
      const body = topRec
        ? { sourceType: 'recommendation', sourceRecommendationId: topRec.id, requestType: 'social_post' }
        : { sourceType: 'manual', requestType: 'social_post', prompt: 'A general post introducing the business' };
      const job = await apiFetch(`/api/mc/locations/${currentLocationId}/create`, { method: 'POST', body: JSON.stringify(body) });
      panel.innerHTML = `
        <div style="font-weight:600; font-size:0.92rem; margin-bottom:0.5rem; color:#F0F2F5;">${escapeHtml(job.headline || '')}</div>
        <div style="margin-bottom:0.6rem;">${escapeHtml(job.body_copy || '')}</div>
        <div style="color:#9CA4B5; font-size:0.8rem;">${escapeHtml(job.format_suggestion || '')} · ${escapeHtml(job.cta || '')}</div>
        <div style="margin-top:0.6rem; color:#9CA4B5; font-size:0.8rem; font-style:italic;">${escapeHtml(job.rationale || '')}</div>
      `;
    } catch (err) {
      panel.innerHTML = `<p>Could not generate a concept right now: ${escapeHtml(err.message)}</p>`;
    }
  }

  // ---------- Explore with Orb Intelligence ----------
  const SUGGESTED_QUESTIONS = [
    'What changed this month?', 'What is working best?', 'What should I be concerned about?',
    'How does this compare to last month?', 'What did you recommend previously?',
  ];

  function openExplore(){
    document.getElementById('exploreDrawer').classList.add('open');
    document.getElementById('exploreBackdrop').classList.add('open');
    const s = document.getElementById('exploreSuggested');
    if (!s.dataset.loaded) {
      s.innerHTML = SUGGESTED_QUESTIONS.map(q => `<button onclick="askSuggested('${q.replace(/'/g, "\\'")}')">${escapeHtml(q)}</button>`).join('');
      s.dataset.loaded = '1';
    }
  }
  function closeExplore(){
    document.getElementById('exploreDrawer').classList.remove('open');
    document.getElementById('exploreBackdrop').classList.remove('open');
  }

  async function loadExploreUsage(locId){
    try {
      const usage = await apiFetch(`/api/mc/locations/${locId}/usage`);
      document.getElementById('exploreUsage').textContent = `${usage.remaining} of ${usage.limit} Intelligence questions remaining today`;
    } catch (err) { /* non-fatal */ }
  }

  async function loadExploreHistory(locId){
    try {
      const { conversationId, messages } = await apiFetch(`/api/mc/locations/${locId}/conversations/latest`);
      currentConversationId = conversationId;
      const box = document.getElementById('exploreMessages');
      box.innerHTML = messages.map(m => `<div class="explore-msg ${m.role}">${escapeHtml(m.content)}</div>`).join('');
      box.scrollTop = box.scrollHeight;
    } catch (err) { /* non-fatal */ }
  }

  async function sendExploreQuestion(){
    const input = document.getElementById('exploreInput');
    const question = input.value.trim();
    if (!question || !currentLocationId) return;
    input.value = '';
    const box = document.getElementById('exploreMessages');
    box.insertAdjacentHTML('beforeend', `<div class="explore-msg user">${escapeHtml(question)}</div>`);
    box.insertAdjacentHTML('beforeend', `<div class="explore-msg assistant" id="explorePending">…</div>`);
    box.scrollTop = box.scrollHeight;

    try {
      const result = await apiFetch(`/api/mc/locations/${currentLocationId}/ask`, {
        method: 'POST',
        body: JSON.stringify({ question, conversationId: currentConversationId }),
      });
      currentConversationId = result.conversationId;
      const pending = document.getElementById('explorePending');
      const answerText = [result.answer.findings, result.answer.recommended_actions, result.answer.insufficient_data].filter(Boolean).join('\n\n');
      pending.textContent = answerText;
      pending.removeAttribute('id');
      document.getElementById('exploreUsage').textContent = `${result.remaining} of ${result.limit} Intelligence questions remaining today`;
    } catch (err) {
      const pending = document.getElementById('explorePending');
      pending.textContent = err.status === 429 ? err.message : 'Sorry, something went wrong answering that.';
      pending.removeAttribute('id');
    }
    box.scrollTop = box.scrollHeight;
  }

  function handleError(err){
    if (err.status === 404) { showOnly('deniedState'); return; }
    showOnly('errorState');
    document.getElementById('errorMessage').textContent = err.message;
  }

  function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await client.auth.signOut();
    window.location.href = '/login.html';
  });

  client.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT') window.location.href = '/login.html';
  });

  client.auth.getSession().then(({ data }) => {
    if (!data.session) { window.location.href = '/login.html'; return; }
    session = data.session;
    document.getElementById('userEmail').textContent = session.user.email;
    viewOrganizations();
  });
</script>
