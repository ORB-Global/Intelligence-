<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teach Vantage — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  body{ font-family:-apple-system,sans-serif; max-width:640px; margin:60px auto; padding:0 20px; color:#26272c; }
  h1{ font-size:20px; font-weight:600; }
  select, textarea{ width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; font:inherit; margin-top:6px; }
  textarea{ min-height:220px; }
  label{ display:block; margin-top:20px; font-size:13px; font-weight:600; color:#555; }
  button{ margin-top:16px; padding:10px 20px; border:none; border-radius:999px; background:#26272c; color:#fff; cursor:pointer; font:inherit; }
  #status{ margin-top:12px; font-size:13px; color:#666; }
  #existing{ margin-top:8px; padding:10px; background:#f5f5f5; border-radius:8px; font-size:13px; white-space:pre-wrap; display:none; }
</style>
</head>
<body>
<h1>Teach Vantage about a business</h1>
<p style="color:#666; font-size:13px;">This is admin-only. What you write here is treated as authoritative, human-taught context — Vantage will weight it above raw data when the two disagree.</p>

<label>Location</label>
<select id="location-select"><option>Loading…</option></select>

<div id="existing"></div>

<label>Tell Vantage about this business</label>
<textarea id="narrative" placeholder="e.g. Big Lots sells some furniture but isn't a real competitor here - customers don't cross-shop. Financing through Snap drives most closes. The owner prioritizes foot traffic over online leads..."></textarea>

<button id="save-btn">Save →</button>
<div id="status"></div>

<script>
const SUPABASE_URL = 'https://vdhsvasxccdrashmvvdk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkaHN2YXN4Y2NkcmFzaG12dmRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMyMDUsImV4cCI6MjEwMDkxOTIwNX0.rZvlbqrdYXlIeAKou-dllsO6MQr3ehzm7h3FBK2sZ6o';
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true } });

(async function(){
  const { data: sessionData } = await client.auth.getSession();
  if (!sessionData.session) { window.location.href = '/login.html'; return; }
  const token = sessionData.session.access_token;

  async function apiFetch(path, opts){
    const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...(opts?.headers||{}) } });
    const body = await res.json();
    if (!res.ok || !body.success) throw new Error(body.error?.message || 'request failed');
    return body.data;
  }

  const orgs = await apiFetch('/api/mc/organizations');
  const { locations } = await apiFetch(`/api/mc/organizations/${orgs[0].id}`);
  const select = document.getElementById('location-select');
  select.innerHTML = locations.map(l => `<option value="${l.id}">${l.name}</option>`).join('');

  async function loadExisting(locationId){
    const existingEl = document.getElementById('existing');
    try {
      const data = await apiFetch(`/api/mc/locations/${locationId}/business-dna`);
      if (data && data.business_dna_narrative) {
        existingEl.style.display = 'block';
        existingEl.textContent = `Current (saved ${new Date(data.business_dna_updated_at).toLocaleString()}):\n\n${data.business_dna_narrative}`;
        document.getElementById('narrative').value = data.business_dna_narrative;
      } else {
        existingEl.style.display = 'block';
        existingEl.textContent = 'Nothing taught yet for this location.';
        document.getElementById('narrative').value = '';
      }
    } catch(e) { existingEl.style.display = 'none'; }
  }
  select.addEventListener('change', () => loadExisting(select.value));
  await loadExisting(select.value);

  document.getElementById('save-btn').addEventListener('click', async () => {
    const narrative = document.getElementById('narrative').value.trim();
    const statusEl = document.getElementById('status');
    if (!narrative) { statusEl.textContent = 'Write something first.'; return; }
    statusEl.textContent = 'Saving…';
    try {
      await apiFetch(`/api/mc/locations/${select.value}/business-dna`, { method: 'POST', body: JSON.stringify({ narrative }) });
      statusEl.textContent = 'Saved. Vantage will use this the next time it reasons about this business.';
    } catch(e) { statusEl.textContent = `Could not save: ${e.message}`; }
  });
})();
</script>
</body>
</html>
