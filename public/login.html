<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Orb Intelligence — Sign In</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{ --ink:#161B26; --ink-soft:#4B5468; --porcelain:#F7F5F2; --surface:#FFFFFF; --line:#E7E2D9; --brass:#AD8A4E; --concern:#9C3D34; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--porcelain); color:var(--ink); font-family:'Public Sans',sans-serif; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:2.5rem; width:100%; max-width:380px; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:1.5rem; margin:0 0 0.3rem; }
  .subtitle{ color:var(--ink-soft); font-size:0.85rem; margin-bottom:1.75rem; }
  label{ display:block; font-size:0.82rem; color:var(--ink-soft); margin-bottom:0.3rem; }
  input{ width:100%; padding:0.65rem 0.8rem; border:1px solid var(--line); border-radius:8px; font-size:0.92rem; margin-bottom:1.1rem; font-family:inherit; }
  button{ width:100%; padding:0.75rem; border:none; border-radius:8px; background:var(--ink); color:var(--porcelain); font-weight:600; font-size:0.9rem; cursor:pointer; }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .link-btn{ background:none; color:var(--brass); font-weight:500; font-size:0.82rem; padding:0; width:auto; margin-top:0.9rem; text-decoration:underline; }
  .error{ color:var(--concern); font-size:0.85rem; margin-bottom:1rem; min-height:1.2em; }
  .status{ color:var(--ink-soft); font-size:0.85rem; margin-bottom:1rem; min-height:1.2em; }
</style>
</head>
<body>
  <div class="card">
    <h1>Orb Intelligence</h1>
    <div class="subtitle">Sign in to your account</div>
    <div id="errorMsg" class="error"></div>
    <div id="statusMsg" class="status"></div>
    <form id="loginForm">
      <label for="account">Account</label>
      <input type="text" id="account" required autocomplete="username" placeholder="e.g. Easley" />
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" />
      <button type="submit" id="loginBtn">Sign In</button>
    </form>
    <button type="button" id="resetBtn" class="link-btn">Forgot password?</button>
  </div>
<script>
  const SUPABASE_URL = 'https://vdhsvasxccdrashmvvdk.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkaHN2YXN4Y2NkcmFzaG12dmRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDMyMDUsImV4cCI6MjEwMDkxOTIwNX0.rZvlbqrdYXlIeAKou-dllsO6MQr3ehzm7h3FBK2sZ6o';
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

  client.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = '/mission-control.html';
  });

  // Resolves a client-facing account name ("Easley") to its real
  // internal email via the server (which never exposes the email
  // itself unless the alias is valid and active). If the input looks
  // like an email already (staff/admin login), skip resolution and
  // use it directly - keeps the existing internal admin login working
  // unchanged on this same page.
  async function resolveAccountToEmail(account) {
    if (account.includes('@')) return account;
    const res = await fetch('/api/resolve-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account }),
    });
    const body = await res.json();
    if (!res.ok || !body.success) throw new Error(body.error?.message || 'Account not found.');
    return body.data.email;
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');
    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    const account = document.getElementById('account').value.trim();
    const password = document.getElementById('password').value;

    let email;
    try {
      email = await resolveAccountToEmail(account);
    } catch (err) {
      errorEl.textContent = err.message || 'Sign in failed.';
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }

    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = 'Incorrect account or password.'; // deliberately generic - never confirm which part was wrong
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }
    window.location.href = '/mission-control.html';
  });

  document.getElementById('resetBtn').addEventListener('click', async () => {
    const errorEl = document.getElementById('errorMsg');
    const statusEl = document.getElementById('statusMsg');
    errorEl.textContent = '';
    statusEl.textContent = '';
    const account = document.getElementById('account').value.trim();
    if (!account) {
      errorEl.textContent = 'Enter your account above first, then click "Forgot password?"';
      return;
    }
    let email;
    try {
      email = await resolveAccountToEmail(account);
    } catch (err) {
      statusEl.textContent = 'If that account exists, a reset link has been sent.'; // generic either way
      return;
    }
    const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/login.html' });
    statusEl.textContent = 'If that account exists, a reset link has been sent.';
  });
</script>
</body>
</html>
